<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>pr@BaDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- style css -->
  <link href="dist/css/bootstrap.min.css" rel="stylesheet">  
  <link href="dist/css/sweetalert.min.css" rel="stylesheet"> 
  <link href="dist/css/style.db.css" rel="stylesheet"> 
</head>
<body class="">

<div class="container px-3">
  <div class="card shadow">
    <div class="card-header">
      <h5 class="fw-bolder">
        Kedai Praba
      </h5>
    </div>
    <div class="card-body">
      <p class="fw-light">
        Terima pesanan sembako dan kebutuhan lainnya dgn harga terjangkau.
      </p>
      
      <button type="button" class="btn btn-sm btn-outline-dark w-50" data-bs-toggle="modal" data-bs-target="#formUser">Klick</button>
      <p>Untuk Memulai Belanja</p>
    </div>
  </div>
</div>

<!-- PAGE PRODUCT -->
<div id="pageProduct" class="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content h-100">
      <div class="modal-header d-flex justify-content-between align-items-center">
        <h5 class="fw-bolder">PRODUCT</h5>
        <span class="badge bg-danger pointer" id="delUser">Logout</span>
      </div>
      <div id="loadProduct" class="modal-body"></div>
      <div class="modal-footer flex-column">
        <div id="tableOrder" class="table-responsive mb-3 w-100"></div>
        <div class="d-flex justify-content-center gap-2">
          <span class="badge bg-dark px-3 pointer" onclick="loadInvoice();m.show('#invoice')">Invoice</span>
          <span class="badge bg-dark pointer d-none" id="btnAddProduct" data-bs-toggle="modal" data-bs-target="#formProduct">Tambah Produk</span>
          <span class="badge bg-success d-none px-3 pointer" id="enter">Checkout</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FORM PRODUCT -->
<div id="formProduct" class="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="fw-bolder">INPUT PRODUCT</h5>
        <span class="btn-close" data-bs-dismiss="modal" onclick="m.show('#pageProduct')"></span>
      </div>
      <div class="modal-body">
        <img id="vew" class="modal-img mb-2 d-none pointer" onclick="pic.click()">
        <div class="d-flex justify-content-center mb-2">
          <input id="pic" type="file" accept="image/*" hidden onchange="viewPicture(this)">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="pic.click()">Pilih Gambar</button>
        </div>

        <label>Nama Produk</label>
        <input type="text" id="pdc">

        <div class="d-flex justify-content-between my-1">
          <div class="mx-1">
            <label>Harga</label>
            <input type="number" id="prc" min="1">
          </div>
          <div class="mx-1">
            <label>Stock</label>
            <input type="number" id="stk" min="0">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm bg-info-subtle" onclick="resetForm()">Reset</button>
        <button class="btn btn-sm bg-danger-subtle d-none" id="del">Hapus</button>
        <button class="btn btn-sm btn-info" onclick="saveProduct()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<!-- INVOICE -->
<div id="invoice" class="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content h-100">
      <div class="modal-header">
        <h5 class="fw-bolder">INVOICE</h5>
        <span class="btn-close" data-bs-dismiss="modal"></span>
      </div>
      <div id="loadInvoice" class="modal-body text-center"></div>
    </div>
  </div>
</div>

<!-- FORM USER -->
<div id="formUser" class="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content mx-2">
      <div class="modal-header justify-content-center">
        <h5 class="fw-lighter">Silakan isi Data sebelum belanja</h5>
      </div>
      <div class="modal-body">
        <label>Nama</label>
        <input type="text" id="username">

        <label>Phone</label>
        <input type="tel" id="telphone">

        <label>Alamat</label>
        <textarea id="address"></textarea>

      </div>
      <div class="modal-footer justify-content-center">
        <button class="btn btn-outline-dark px-3" id="addUser">Simpan</button>
      </div>
    </div>
  </div>
</div>

<!-- script js -->
<script src="dist/js/bootstrap.bundle.min.js"></script>  
<script src="dist/js/sweetalert.min.js"></script>  
<script src="dist/js/canvas.min.js"></script>
<script src="dist/js/script.db.js"></script>
</body>
</html>
